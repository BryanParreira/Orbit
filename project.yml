name: Orbit
options:
  bundleIdPrefix: com.orbitvm
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

configFiles:
  Debug: Config/Orbit.xcconfig
  Release: Config/Orbit.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - path: Orbit
        excludes:
          - "**/*.md"
    dependencies:
      - package: Sparkle
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleName: Orbit
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Orbit. Virtualization engine adapted from UTM (Apache 2.0)."
        NSMicrophoneUsageDescription: "Orbit forwards your microphone to virtual machines that have audio input enabled."
        NSLocalNetworkUsageDescription: "Orbit uses the local network to connect virtual machines."
        SUFeedURL: "$(ORBIT_FEED_URL)"
        SUPublicEDKey: "$(ORBIT_SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUVerifyUpdateBeforeExtraction: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Orbit Virtual Machine
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.orbitvm.vm]
            LSTypeIsPackage: true
          - CFBundleTypeName: Disk Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.iso-image, com.apple.disk-image-udif]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.orbitvm.vm
            UTTypeDescription: Orbit Virtual Machine
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeIconSystemGenerated: 1
            UTTypeTagSpecification:
              public.filename-extension: [orbitvm]
    entitlements:
      path: Orbit/Orbit.entitlements
      properties:
        com.apple.security.virtualization: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitvm.Orbit
        PRODUCT_NAME: Orbit
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES

  OrbitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [OrbitTests]
    dependencies:
      - target: Orbit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.orbitvm.OrbitTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Orbit.app/Contents/MacOS/Orbit"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"

schemes:
  Orbit:
    build:
      targets:
        Orbit: all
        OrbitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [OrbitTests]
    archive:
      config: Release
